name: OCS Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Update README
        run: pnpm update-readme

      - name: Ensure README is committed
        run: git diff --exit-code README.md

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend bundle
        run: pnpm build-vite

      - name: Run backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release_desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain (macOS)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust toolchain (non-macOS)
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version to tag
        run: pnpm update-version ${{ github.ref_name }}

      - name: Build the app (Desktop)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Obsidian Chess Studio ${{ github.ref_name }}
          releaseBody: "Obsidian Chess Studio (OCS) release ${{ github.ref_name }}. See the assets to download and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release_android:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Android SDK env vars
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"

      - name: Cache Android SDK (platforms/build-tools/ndk)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-36
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0
            ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          key: android-sdk-${{ runner.os }}-api36-bt36-ndk26.3.11579264

      - name: Install Android SDK packages (only if missing)
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          need_install=0
          [ -d "$ANDROID_SDK_ROOT/platform-tools" ] || need_install=1
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || need_install=1
          [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ] || need_install=1
          [ -d "$ANDROID_SDK_ROOT/ndk/26.3.11579264" ] || need_install=1

          if [ "$need_install" -eq 1 ]; then
            sdkmanager --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "ndk;26.3.11579264"
          else
            echo "Android SDK/NDK already present (cache hit)."
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain (Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: rust-${{ runner.os }}-android-aarch64

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/gradle-wrapper.properties', 'src-tauri/gen/android/**/build.gradle*', 'src-tauri/gen/android/**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Sync app version to tag
        run: pnpm update-version ${{ github.ref_name }}

      - name: Decode Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ocs-release.jks"
          ls -la "$RUNNER_TEMP/ocs-release.jks"

      - name: Build the app (Android)
        env:
          CI: false
        run: pnpm android:build

      - name: Sign Release APK (zipalign + apksigner)
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$ZIPALIGN" ] || [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: zipalign/apksigner not found under build-tools;36.0.0"
            ls -la "$ANDROID_SDK_ROOT/build-tools/36.0.0" || true
            exit 1
          fi

          UNSIGNED_APK=$(find src-tauri/gen/android -type f -name "*release-unsigned*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Could not find *release-unsigned*.apk"
            find src-tauri/gen/android -type f -name "*.apk" | sed 's/^/ - /'
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          mkdir -p dist
          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" dist/ocs-release-aligned.apk

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ocs-release.jks" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out dist/ocs-release-signed.apk \
            dist/ocs-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs dist/ocs-release-signed.apk

      - name: Upload Signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            dist/ocs-release-signed.apk
